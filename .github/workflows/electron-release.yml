name: Electron Windows x64 GitHub Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release-electron:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:electron
      - run: pnpm test:frontend
      - run: pnpm tsc --noEmit
      - run: pnpm electron:build
      - name: Require Windows signing certificate
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CSC_LINK)) {
            throw "Required signing secret missing: WIN_CSC_LINK"
          }
          if ([string]::IsNullOrWhiteSpace($env:CSC_KEY_PASSWORD)) {
            throw "Required signing secret missing: WIN_CSC_KEY_PASSWORD"
          }
      - name: Build and sign Windows x64 NSIS
        shell: pwsh
        env:
          ELECTRON_REQUIRE_SIGNING: "1"
          ELECTRON_PUBLISH: ${{ github.event_name == 'push' && '1' || '0' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: pnpm electron:release:validate
      - name: Validate installer metadata
        run: pnpm electron:validate-artifacts artifacts/electron
      - uses: actions/upload-artifact@v4
        with:
          name: vora-mind-electron-x64
          path: |
            artifacts/electron/*.exe
            artifacts/electron/*.exe.blockmap
            artifacts/electron/latest.yml
            artifacts/electron/latest-validation.json
          if-no-files-found: error
